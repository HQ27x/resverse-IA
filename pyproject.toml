[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resverse-ia"
version = "0.1.0"
description = "Local-first AI-assisted reverse engineering bridge for Ghidra"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ghidra = ["pyghidra>=2.2"]
patch = ["iced-x86>=1.21"]
dev = ["pytest>=8"]

[project.scripts]
reia = "reia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reia = ["py.typed"]
